<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thynkverse guides</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#111215;--panel:#17181b;--line:#2c2d32;--ink:#f3f1ee;--muted:#a3a0a6;--or:#ff7417}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 520px at 10% -5%,rgba(255,116,23,.13),transparent 60%),var(--bg);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 48px;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.tv{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.tv span{color:var(--or)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:56px 0}
h1{margin:0 0 36px;font-size:clamp(48px,9vw,104px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:26px 26px 24px;min-height:190px;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--or);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.lg{font-weight:800;letter-spacing:-.04em;font-size:38px;display:inline-flex;align-items:center;gap:8px}
.lg .o{color:var(--or)}
.crm{font-size:11px;letter-spacing:.22em;border:1.5px solid var(--or);border-radius:7px;padding:3px 7px;font-weight:700}
.card p{margin:18px 0 0;color:var(--muted);font-size:15px}
.arrow{position:absolute;right:24px;top:24px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.card:hover .arrow{background:var(--or);border-color:var(--or);color:#170800}
.arrow svg{width:16px;height:16px}
footer{color:#6f6c72;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="tv" href="/">thynk<span>verse</span></a></div>
  <main>
    <h1>Guides</h1>
    <div class="grid">
      <a class="card" href="/ithynk-crm">
        <span class="lg"><span><span class="o">i</span>Th<span class="o">y</span>nk</span><span class="crm">CRM</span></span>
        <p>Sales, Payments, Supervisor and Company Admin</p>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
    </div>
  </main>
  <footer>Powered &amp; designed by Thynkverse</footer>
</div>
</body>
</html>
